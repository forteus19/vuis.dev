<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Cloud Stats</title>
	</head>
	<body>
		<div class="top-nav">
			<a href="index.html">Home</a>
		</div>

		<h2>Scoreboards</h2>

		<p id="loading-text">Loading...</p>

		<div id="stats-content" hidden>
			<h3>Players</h3>

			<table id="stat-scoreboard-players">
				<tr>
					<th style="width: 40px">#</th>
					<th style="width: 160px">Player</th>
					<th style="width: 130px">Score</th>
				</tr>
			</table>

			<button id="expand-players-button" hidden>Show more</button>

			<h3>Brigades</h3>

			<table id="stat-scoreboard-clans">
				<tr>
					<th style="width: 40px">#</th>
					<th style="width: 130px">Brigade</th>
					<th style="width: 130px">Score</th>
				</tr>
			</table>

			<button id="expand-clans-button" hidden>Show more</button>
		</div>

		<script type="module" src="/src/common.ts"></script>
		<script type="module" src="/src/blockfront_stats/scoreboards.ts"></script>
	</body>
</html>
